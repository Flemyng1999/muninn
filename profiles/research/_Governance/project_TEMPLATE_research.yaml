meta:
  project_id: "<YOUR_PROJECT>"
  project_name_zh: "<中文名>"
  project_name_en: "<English Name>"
  version: "0.1.0"
  created: "YYYY-MM-DD"
  last_reviewed: "YYYY-MM-DD"
  scope_under_constitution: "<YOUR_PROJECT> + L0/L1"
  repo_path: "<项目仓库绝对路径>"

# 核心概念：5–10 张主卡级别术语（跨 3 篇以上被引用才算核心）
# tier: L1 = 跨项目通用（scope: global） / L2 = 本项目特有（scope: project:<YOUR_PROJECT>）
core_concepts:
  # - name: "<术语>"
  #   aliases: ["<别名1>", "<别名2>"]
  #   master_card: "概念-<术语>"
